</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14365d"/></marker><marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c27a00"/></marker></defs><rect width="1600" height="640" fill="#fff"/><text x="40" y="52" class="h">Rooftop Solar PV System – Kampala Marriott Hotel</text><text x="40" y="80" class="sub">185.4 kWp grid-tied system · all solar energy used by the hotel · no battery</text><rect x="40" y="130" width="230" height="210" rx="14" fill="#eef4ff" stroke="#1f4fb5" stroke-width="2.5"/><circle cx="121.0" cy="160" r="10" fill="#eda100"/><rect x="133.0" y="162" width="56" height="34" fill="#1f4fb5" stroke="#14365d" stroke-width="2" transform="skewX(-12)"/><line x1="151.7" y1="162" x2="151.7" y2="196" stroke="#9fb7e6" stroke-width="1.5" transform="skewX(-12)"/><line x1="170.4" y1="162" x2="170.4" y2="196" stroke="#9fb7e6" stroke-width="1.5" transform="skewX(-12)"/><line x1="133.0" y1="179" x2="189.0" y2="179" stroke="#9fb7e6" stroke-width="1.5" transform="skewX(-12)"/><text x="155.0" y="240" class="bt" text-anchor="middle">Solar Panels</text><text x="155.0" y="266" class="bs" text-anchor="middle">299 panels × 620 W</text><text x="155.0" y="288" class="bs" text-anchor="middle">185.4 kWp on the roof</text><rect x="360" y="130" width="230" height="210" rx="14" fill="#eef2f6" stroke="#14365d" stroke-width="2.5"/><rect x="449.0" y="154" width="52" height="46" rx="5" fill="#fff" stroke="#14365d" stroke-width="2.5"/><line x1="449.0" y1="200" x2="501.0" y2="154" stroke="#14365d" stroke-width="1.5"/><text x="460.0" y="172" class="ic">=</text><text x="480.0" y="195" class="ic">~</text><text x="475.0" y="240" class="bt" text-anchor="middle">2 Inverters</text><text x="475.0" y="266" class="bs" text-anchor="middle">2 × 80 kW</text><text x="475.0" y="288" class="bs" text-anchor="middle">convert DC to AC power</text><rect x="680" y="130" width="230" height="210" rx="14" fill="#eef2f6" stroke="#14365d" stroke-width="2.5"/><rect x="773.0" y="152" width="44" height="50" rx="4" fill="#fff" stroke="#14365d" stroke-width="2.5"/><rect x="781.0" y="160" width="28" height="8" rx="2" fill="#c9d0d8"/><rect x="781.0" y="174" width="28" height="8" rx="2" fill="#c9d0d8"/><rect x="781.0" y="188" width="28" height="8" rx="2" fill="#c9d0d8"/><text x="795.0" y="240" class="bt" text-anchor="middle">AC Combiner Panel</text><text x="795.0" y="266" class="bs" text-anchor="middle">on the roof</text><text x="795.0" y="288" class="bs" text-anchor="middle">joins both inverters</text><rect x="1000" y="130" width="230" height="210" rx="14" fill="#eef2f6" stroke="#14365d" stroke-width="2.5"/><rect x="1093.0" y="152" width="44" height="50" rx="4" fill="#fff" stroke="#14365d" stroke-width="2.5"/><rect x="1101.0" y="160" width="28" height="8" rx="2" fill="#c9d0d8"/><rect x="1101.0" y="174" width="28" height="8" rx="2" fill="#c9d0d8"/><rect x="1101.0" y="188" width="28" height="8" rx="2" fill="#c9d0d8"/><text x="1115.0" y="240" class="bt" text-anchor="middle">Main Switchboard</text><text x="1115.0" y="266" class="bs" text-anchor="middle">hotel LV room</text><text x="1115.0" y="288" class="bs" text-anchor="middle">solar + grid meet here</text><rect x="1320" y="130" width="230" height="210" rx="14" fill="#fff6e5" stroke="#c27a00" stroke-width="2.5"/><rect x="1405.0" y="156" width="60" height="46" fill="#fff" stroke="#14365d" stroke-width="2.5"/><polygon points="1399.0,156 1435.0,136 1471.0,156" fill="#14365d"/><rect x="1413.0" y="164" width="10" height="9" fill="#eda100"/><rect x="1413.0" y="180" width="10" height="9" fill="#eda100"/><rect x="1429.0" y="164" width="10" height="9" fill="#eda100"/><rect x="1429.0" y="180" width="10" height="9" fill="#eda100"/><rect x="1445.0" y="164" width="10" height="9" fill="#eda100"/><rect x="1445.0" y="180" width="10" height="9" fill="#eda100"/><text x="1435.0" y="240" class="bt" text-anchor="middle">Hotel Loads</text><text x="1435.0" y="266" class="bs" text-anchor="middle">≈ 1,000,000 kWh/month</text><text x="1435.0" y="288" class="bs" text-anchor="middle">rooms, kitchen, A/C, lifts</text><line x1="270" y1="235.0" x2="354" y2="235.0" class="arr" marker-end="url(#h)"/><text x="312.0" y="223.0" class="al" text-anchor="middle">DC power</text><line x1="590" y1="235.0" x2="674" y2="235.0" class="arr" marker-end="url(#h)"/><text x="632.0" y="223.0" class="al" text-anchor="middle">AC power</text><line x1="910" y1="235.0" x2="994" y2="235.0" class="arr" marker-end="url(#h)"/><text x="952.0" y="223.0" class="al" text-anchor="middle">AC power</text><line x1="1230" y1="235.0" x2="1314" y2="235.0" class="arr" marker-end="url(#h)"/><text x="1272.0" y="223.0" class="al" text-anchor="middle">Electricity</text><rect x="1000" y="420" width="230" height="180" rx="14" fill="#f4f6f9" stroke="#5b6673" stroke-width="2.5"/><polyline points="1097.0,492 1115.0,438 1133.0,492" fill="none" stroke="#14365d" stroke-width="2.5"/><line x1="1091.0" y1="454" x2="1139.0" y2="454" stroke="#14365d" stroke-width="2.5"/><line x1="1101.0" y1="470" x2="1129.0" y2="470" stroke="#14365d" stroke-width="2.5"/><text x="1115.0" y="530" class="bt" text-anchor="middle">Utility Grid (UEDCL)</text><text x="1115.0" y="556" class="bs" text-anchor="middle">supplies the rest</text><text x="1115.0" y="578" class="bs" text-anchor="middle">of the hotel&#x27;s power</text><line x1="1115.0" y1="420" x2="1115.0" y2="346" class="arr" marker-end="url(#h)"/><text x="1185.0" y="395" class="al" text-anchor="middle">Grid power</text><rect x="360" y="420" width="550" height="180" rx="14" fill="#fff6e5" stroke="#c27a00" stroke-width="2.5"/><rect x="611.0" y="448" width="48" height="38" rx="5" fill="#fff" stroke="#c27a00" stroke-width="2.5"/><polyline points="619.0,474 629.0,462 639.0,470 651.0,458" fill="none" stroke="#c27a00" stroke-width="2.5"/><text x="635.0" y="530" class="bt" text-anchor="middle">Zero-Export Controller &amp; Monitoring</text><text x="635.0" y="556" class="bs" text-anchor="middle">measures the hotel&#x27;s grid use and keeps solar output</text><text x="635.0" y="578" class="bs" text-anchor="middle">below the load – no power is sent back to the grid</text><line x1="994" y1="510" x2="916" y2="510" class="arrd" marker-end="url(#hd)"/><line x1="440" y1="420" x2="440" y2="346" class="arrd" marker-end="url(#hd)"/><text x="488" y="395" class="al" text-anchor="middle">controls</text><text x="958.0" y="494" class="al" text-anchor="middle">measures</text></svg>