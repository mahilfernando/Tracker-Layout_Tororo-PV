<!doctype html><html><head><meta charset="utf-8"><title>Array Bonding</title>
<style>body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif}svg{display:block}
text{fill:#1b2430}.h{font-size:22px;font-weight:700;fill:#14365d}.s{font-size:13px}.b{font-size:13px;font-weight:700}.sm{font-size:11.5px;fill:#4a5561}
.g{stroke:#1c9a35;stroke-width:4;fill:none}.gs{stroke:#1c9a35;stroke-width:6;fill:none}.rail{fill:#b9c3cf;stroke:#5b6673;stroke-width:1.2}
.mod{fill:#2a4f9e;stroke:#0f2a5c;stroke-width:1.5}.cell{stroke:#6f8fd0;stroke-width:.8}.frame{fill:#c9d0d8;stroke:#5b6673;stroke-width:1.5}
.blk{fill:#9a9a9a;stroke:#555}.clamp{fill:#e0a020;stroke:#7a5200;stroke-width:1.2}.box{fill:#fff;stroke:#14365d;stroke-width:1.5}
.tray{fill:none;stroke:#c0392b;stroke-width:2;stroke-dasharray:8 4}.num{fill:#d62020}.numt{fill:#fff;font-size:13px;font-weight:700}</style></head><body>
<svg viewBox="0 0 1400 960" width="1400" height="960">
<rect width="1400" height="960" fill="#fff"/>
<text x="30" y="40" class="h">How the 16 mm² bonding conductor is fixed – Kampala Marriott rooftop PV</text>
<text x="30" y="64" class="s">Green/yellow wire connects every metal part (rails, frames, tray, inverters) to the building earth, so nothing can become "live" if a cable fails or lightning strikes nearby.</text>

<!-- ============ 3D-ish view of one table ============ -->
<text x="30" y="100" class="b">① ONE TABLE (side view, 10° tilt) – wire clamped to the rail</text>
<g transform="translate(60,130)">
  <!-- roof -->
  <rect x="-30" y="300" width="640" height="14" fill="#d9dde2"/>
  <text x="560" y="335" class="sm">roof slab</text>
  <!-- ballast blocks + legs -->
  <rect x="60" y="270" width="60" height="30" class="blk"/><rect x="400" y="270" width="60" height="30" class="blk"/>
  <text x="40" y="294" class="sm">ballast</text>
  <polygon points="88,270 92,270 92,215 88,215" class="frame"/><polygon points="428,270 432,270 432,150 428,150" class="frame"/>
  <!-- rails (two lines, tilted) -->
  <g transform="rotate(-10 90 215)">
    <rect x="40" y="205" width="470" height="12" class="rail"/>
    <!-- modules on top -->
    <rect x="45" y="175" width="225" height="28" class="mod"/><rect x="280" y="175" width="225" height="28" class="mod"/>
    <!-- module clamps -->
    <rect x="270" y="168" width="10" height="40" class="clamp"/><rect x="35" y="168" width="10" height="40" class="clamp"/><rect x="505" y="168" width="10" height="40" class="clamp"/>
    <!-- bonding wire along the rail underneath -->
    <path d="M 40 226 L 520 226" class="g"/>
    <!-- rail bonding lugs -->
    <circle cx="70" cy="222" r="7" fill="#1c9a35"/><circle cx="300" cy="222" r="7" fill="#1c9a35"/><circle cx="490" cy="222" r="7" fill="#1c9a35"/>
  </g>
  <!-- labels -->
  <line x1="300" y1="168" x2="330" y2="80" stroke="#7a5200"/><text x="335" y="76" class="sm">module clamp with bonding (earthing) pins – bites through</text>
  <text x="335" y="91" class="sm">the frame coating, so every panel is bonded to the rail</text>
  <line x1="300" y1="190" x2="560" y2="140" stroke="#1c9a35"/><text x="565" y="136" class="b" style="fill:#1c9a35">16 mm² Cu G/Y bonding wire</text>
  <text x="565" y="152" class="sm">runs along the rail, under the panels (shaded, UV-resistant)</text>
  <line x1="490" y1="140" x2="560" y2="190" stroke="#1c9a35"/><text x="565" y="194" class="sm">bonding clamp / lug bolted to each rail</text>
  <text x="565" y="209" class="sm">(earthing clip on the rail channel, every rail line)</text>
</g>

<!-- ============ detail of the rail clamp ============ -->
<text x="980" y="100" class="b">② DETAIL – wire to rail</text>
<g transform="translate(990,120)">
  <rect x="0" y="40" width="360" height="40" class="rail"/>
  <text x="285" y="35" class="sm">aluminium rail</text>
  <path d="M 0 120 C 100 120 130 120 160 95" class="gs"/>
  <path d="M 200 95 C 230 120 260 120 360 120" class="gs"/>
  <rect x="150" y="75" width="60" height="30" rx="4" class="clamp"/>
  <circle cx="180" cy="62" r="10" fill="#666" stroke="#222"/><line x1="180" y1="52" x2="180" y2="105" stroke="#222" stroke-width="3"/>
  <text x="150" y="150" class="sm">earthing clamp (stainless bolt into rail slot)</text>
  <text x="150" y="166" class="sm">wire passes through – one clamp per rail end,</text>
  <text x="150" y="182" class="sm">so the wire is continuous along the table</text>
  <text x="0" y="145" class="b" style="fill:#1c9a35">16 mm² G/Y</text>
</g>

<!-- ============ plan of the route ============ -->
<text x="30" y="500" class="b">③ ROUTE (plan) – tables → tray → inverter station → building earth</text>
<g transform="translate(40,520)">
  <!-- 7 tables -->
  <g id="tabs">
  </g>
  <rect x="0" y="0" width="560" height="38" fill="#dfe7f5" stroke="#1f4fb5"/><text x="10" y="24" class="s">T1</text>
  <rect x="0" y="50" width="560" height="38" fill="#dfe7f5" stroke="#1f4fb5"/><text x="10" y="74" class="s">T2</text>
  <rect x="0" y="100" width="560" height="22" fill="#dfe7f5" stroke="#1f4fb5"/><text x="10" y="116" class="s">T3</text>
  <rect x="0" y="140" width="560" height="38" fill="#dcf2e8" stroke="#1b8f63"/><text x="10" y="164" class="s">T4…T7</text>
  <text x="200" y="208" class="sm">(T5, T6, T7 same – 7 tables in total)</text>
  <!-- bonding wires along tables -->
  <path d="M 30 30 L 560 30 L 610 30" class="g"/><path d="M 30 80 L 560 80 L 610 80" class="g"/><path d="M 30 116 L 560 116 L 610 116" class="g"/><path d="M 30 170 L 560 170 L 610 170" class="g"/>
  <!-- tray -->
  <line x1="610" y1="0" x2="610" y2="260" class="tray"/>
  <text x="620" y="12" class="sm" style="fill:#c0392b">cable tray (east corridor)</text>
  <path d="M 616 20 L 616 300 L 760 300" class="gs"/>
  <text x="625" y="240" class="b" style="fill:#1c9a35">35 mm² earth spine</text><text x="625" y="256" class="sm">in the tray, all table wires join it</text>
  <!-- station -->
  <rect x="760" y="270" width="300" height="70" class="box"/>
  <text x="770" y="290" class="b">INVERTER STATION</text>
  <text x="770" y="308" class="sm">DC units · INV-01 · INV-02 · ACCP</text>
  <rect x="900" y="318" width="140" height="12" fill="#e8f6ea" stroke="#1c9a35"/><text x="1045" y="314" class="sm" style="fill:#1c9a35" text-anchor="end">ACCP earth bar</text>
  <path d="M 790 330 L 790 324 L 900 324" stroke="#1c9a35" stroke-width="3" fill="none"/>
  <text x="770" y="365" class="sm">inverters & DC SPD units → earth bar (25 mm²)</text>
  <!-- E3 -->
  <path d="M 1040 324 L 1180 324 L 1180 200" class="gs"/>
  <text x="1050" y="250" class="b" style="fill:#1c9a35">E3 120 mm²</text><text x="1050" y="266" class="sm">≈ 200 m to LV room</text>
  <rect x="1120" y="150" width="140" height="50" class="box"/><text x="1130" y="172" class="b">MET</text><text x="1130" y="190" class="sm">main earth terminal</text>
  <line x1="1190" y1="150" x2="1190" y2="120" stroke="#1c9a35" stroke-width="3"/>
  <line x1="1172" y1="120" x2="1208" y2="120" stroke="#1c9a35" stroke-width="3"/><line x1="1178" y1="112" x2="1202" y2="112" stroke="#1c9a35" stroke-width="3"/><line x1="1185" y1="104" x2="1195" y2="104" stroke="#1c9a35" stroke-width="3"/>
  <text x="1215" y="116" class="sm">building earth</text>
</g>
<text x="40" y="945" class="sm">Quantity: 7 tables × ≈ 26.6 m + ≈ 1 m jumper each ≈ 195 m → allow ≈ 210 m of 16 mm² · 35 mm² spine ≈ 45 m · clamps: 1 per rail line end (≈ 52 nos) + module bonding clips/pins per Enerack.</text>
</svg></body></html>
