<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raw register test</title>
<style>
  :root { --bg:#F3F4F1; --ink:#15191E; --muted:#4A5159; --line:#D3D7D0; --soft:#ECEEEA; --accent:#B4530A; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size:15px; }
  header { background:var(--ink); color:#F3F4F1; }
  .wrap { max-width:1200px; margin:0 auto; padding:16px 24px; }
  header .wrap { display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:center; }
  header a { color:#F0A060; }
  #conn { font-size:14px; color:#C9CEC6; display:flex; gap:8px; align-items:center; }
  #dot { width:10px; height:10px; border-radius:50%; background:#888; }
  .main { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start; margin-top:16px; }
  .box { background:#fff; border:1px solid var(--line); border-radius:12px; }
  .tablebox { flex:999 1 560px; min-width:0; overflow-x:auto; }
  .side { flex:1 1 360px; min-width:0; padding:16px; }
  table { width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums; }
  th { text-align:left; color:var(--muted); font-weight:600; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:8px 12px; border-bottom:1px solid var(--soft); white-space:nowrap; font-family: ui-monospace, Consolas, monospace; }
  .num { text-align:right; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:#F7F8F5; }
  tbody tr.sel { background:#FBEBDD; }
  tr.changed td.val { color:var(--accent); font-weight:700; }
  .nodata { color:var(--muted); }
  svg { width:100%; height:200px; display:block; }
  .muted { color:var(--muted); font-size:13px; }
  .empty { padding:24px; text-align:center; color:var(--muted); }
  h2 { font-size:16px; margin:0 0 8px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <b>Raw register test</b>
    <span id="conn"><span id="dot"></span><span id="status">connecting…</span></span>
    <a href="/">← Tracker dashboard</a>
  </div>
</header>
<main class="wrap">
  <div class="muted" id="source">Waiting for raw_poller.py…</div>
  <div class="main">
    <div class="box tablebox">
      <table>
        <thead><tr><th>Address</th><th class="num">uint16</th><th class="num">int16</th><th>Hex</th><th class="num">÷10</th><th class="num">÷100</th><th>Note</th></tr></thead>
        <tbody id="rows"><tr><td colspan="7" class="empty">No data yet.</td></tr></tbody>
      </table>
    </div>
    <div class="box side" id="side"><div class="empty">Click a register to chart it.</div></div>
  </div>
  <p class="muted">Values that change since the last read are shown in orange. 65535 (0xFFFF) and 32767 (0x7FFF) usually mean "no data / not used" on PVH devices.</p>
</main>
<script>
let prev = {}, sel = null;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const s16 = v => v > 32767 ? v - 65536 : v;

function setStatus(ok, text) {
  document.getElementById("dot").style.background = ok ? "#5CC08A" : "#E5484D";
  document.getElementById("status").textContent = text;
}

async function refresh() {
  let rows;
  try { rows = await (await fetch("/api/raw/latest")).json(); }
  catch (e) { return setStatus(false, "web server offline"); }
  if (!rows.length) return setStatus(false, "no data – start raw_poller.py");
  const ts = rows[0].ts, age = (Date.now() - new Date(ts)) / 1000;
  setStatus(age < 30, (age < 30 ? "last read " : "STALE – last read ") + new Date(ts).toLocaleTimeString());
  document.getElementById("source").textContent = `Source: ${rows[0].source} · ${rows.length} registers`;
  document.getElementById("rows").innerHTML = rows.map(r => {
    const v = r.value, nodata = v === 65535 || v === 32767;
    const changed = r.address in prev && prev[r.address] !== v;
    return `<tr data-a="${r.address}" class="${r.address === sel ? "sel" : ""} ${changed ? "changed" : ""}">
      <td>${r.address}</td><td class="num val">${v}</td><td class="num">${s16(v)}</td><td>0x${v.toString(16).toUpperCase().padStart(4,"0")}</td>
      <td class="num">${(s16(v)/10).toFixed(1)}</td><td class="num">${(s16(v)/100).toFixed(2)}</td>
      <td class="nodata">${nodata ? "no data?" : ""}</td></tr>`;
  }).join("");
  prev = Object.fromEntries(rows.map(r => [r.address, r.value]));
  document.querySelectorAll("#rows tr[data-a]").forEach(tr => tr.onclick = () => { sel = +tr.dataset.a; refresh(); });
  if (sel !== null) chart();
}

async function chart() {
  const h = await (await fetch(`/api/raw/history/${sel}?limit=360`)).json();
  const side = document.getElementById("side");
  if (h.length < 2) { side.innerHTML = `<h2>Register ${sel}</h2><div class="empty">Not enough reads yet.</div>`; return; }
  const vals = h.map(p => p.value);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi === lo) { hi += 1; lo -= 1; }
  const pts = h.map((p, i) => `${(i / (h.length - 1) * 1000).toFixed(1)},${(190 - (p.value - lo) / (hi - lo) * 180).toFixed(1)}`).join(" ");
  side.innerHTML = `<h2>Register ${sel}</h2>
    <svg viewBox="0 0 1000 200" preserveAspectRatio="none" role="img" aria-label="History of register ${sel}">
      <polyline fill="none" stroke="#B4530A" stroke-width="2" vector-effect="non-scaling-stroke" points="${pts}"/></svg>
    <div class="muted">${new Date(h[0].ts).toLocaleTimeString()} → ${new Date(h.at(-1).ts).toLocaleTimeString()} · min ${Math.min(...vals)} · max ${Math.max(...vals)} · ${h.length} reads</div>`;
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
