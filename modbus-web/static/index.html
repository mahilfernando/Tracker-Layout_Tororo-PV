<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracker monitor</title>
<style>
  :root { --bg:#F3F4F1; --ink:#15191E; --muted:#4A5159; --line:#D3D7D0; --card:#fff; --accent:#B4530A; --ok:#1E6B44; --bad:#B42318; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background:var(--ink); color:#F3F4F1; }
  .wrap { max-width:1200px; margin:0 auto; padding:16px 24px; }
  header .wrap { display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:center; }
  header b { font-size:18px; }
  #conn { font-size:14px; color:#C9CEC6; display:flex; gap:8px; align-items:center; }
  #dot { width:10px; height:10px; border-radius:50%; background:#888; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px; margin:24px 0; }
  .tile, section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  .tile .label { font-size:14px; color:var(--muted); }
  .tile .value { font-size:36px; font-weight:600; font-family: ui-monospace, Consolas, monospace; margin:6px 0; }
  .tile .tag { font-size:13px; color:var(--muted); font-family: ui-monospace, Consolas, monospace; }
  section { margin-bottom:24px; }
  section h2 { margin:0 0 12px; font-size:18px; display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px; align-items:center; }
  select { font:inherit; font-size:14px; min-height:44px; padding:0 12px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  svg { width:100%; height:240px; display:block; }
  .note { font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <b>Tracker monitor</b>
    <span id="conn"><span id="dot"></span><span id="status">connecting…</span></span>
  </div>
</header>
<main class="wrap">
  <div class="tiles" id="tiles"></div>

  <section>
    <h2>
      <span>History</span>
      <span>
        <label for="tagSel" class="note">Tag</label>
        <select id="tagSel"></select>
        <label for="rangeSel" class="note">Range</label>
        <select id="rangeSel">
          <option value="120">10 min</option>
          <option value="720" selected>1 hour</option>
          <option value="8640">12 hours</option>
        </select>
      </span>
    </h2>
    <svg id="chart" viewBox="0 0 1000 240" preserveAspectRatio="none" role="img" aria-label="History chart"></svg>
    <div class="note" id="chartNote"></div>
  </section>
</main>

<script>
const POLL_MS = 5000;
let TAGS = [];

const fmt = (v, tag) => {
  if (v === null || v === undefined) return "–";
  const decimals = tag.scale >= 1 ? 0 : Math.min(3, Math.round(-Math.log10(tag.scale)));
  return v.toFixed(decimals) + (tag.unit ? " " + tag.unit : "");
};

function buildTiles() {
  const box = document.getElementById("tiles");
  const sel = document.getElementById("tagSel");
  for (const t of TAGS) {
    const div = document.createElement("div");
    div.className = "tile";
    div.innerHTML = `<div class="label"></div><div class="value" id="v_${t.name}">–</div><div class="tag"></div>`;
    div.querySelector(".label").textContent = t.name.replace(/_/g, " ");
    div.querySelector(".tag").textContent = t.name;
    box.appendChild(div);
    sel.add(new Option(t.name, t.name));
  }
}

function setStatus(ok, text) {
  document.getElementById("dot").style.background = ok ? "#5CC08A" : "#E5484D";
  document.getElementById("status").textContent = text;
}

async function refreshLatest() {
  try {
    const rows = await (await fetch("/api/latest")).json();
    if (!rows.length) return setStatus(false, "no data yet – is poller.py running?");
    let newest = "";
    for (const r of rows) {
      const tag = TAGS.find(t => t.name === r.tag);
      const el = document.getElementById("v_" + r.tag);
      if (tag && el) el.textContent = fmt(r.value, tag);
      if (r.ts > newest) newest = r.ts;
    }
    const ageS = (Date.now() - new Date(newest)) / 1000;
    const stale = ageS > 3 * POLL_MS / 1000;
    setStatus(!stale, (stale ? "STALE – last data " : "last update ") + new Date(newest).toLocaleTimeString());
  } catch (e) {
    setStatus(false, "web server offline");
  }
}

async function refreshChart() {
  const name = document.getElementById("tagSel").value;
  const limit = document.getElementById("rangeSel").value;
  const tag = TAGS.find(t => t.name === name);
  let rows = [];
  try { rows = await (await fetch(`/api/history/${name}?limit=${limit}`)).json(); } catch (e) {}
  const svg = document.getElementById("chart");
  const note = document.getElementById("chartNote");
  if (rows.length < 2) { svg.innerHTML = ""; note.textContent = "Not enough data yet."; return; }
  const vals = rows.map(r => r.value);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi === lo) { hi += 1; lo -= 1; }
  const x = i => (i / (rows.length - 1)) * 1000;
  const y = v => 225 - ((v - lo) / (hi - lo)) * 210;
  const pts = rows.map((r, i) => x(i).toFixed(1) + "," + y(r.value).toFixed(1)).join(" ");
  svg.innerHTML =
    `<line x1="0" x2="1000" y1="15" y2="15" stroke="#ECEEEA"/>` +
    `<line x1="0" x2="1000" y1="225" y2="225" stroke="#ECEEEA"/>` +
    `<polyline fill="none" stroke="#B4530A" stroke-width="2" vector-effect="non-scaling-stroke" points="${pts}"/>`;
  const t0 = new Date(rows[0].ts).toLocaleTimeString(), t1 = new Date(rows.at(-1).ts).toLocaleTimeString();
  note.textContent = `${t0} → ${t1} · min ${fmt(lo, tag)} · max ${fmt(hi, tag)} · ${rows.length} points`;
}

async function start() {
  try { TAGS = await (await fetch("/api/tags")).json(); }
  catch (e) { return setStatus(false, "web server offline"); }
  buildTiles();
  document.getElementById("tagSel").onchange = refreshChart;
  document.getElementById("rangeSel").onchange = refreshChart;
  const tick = () => { refreshLatest(); refreshChart(); };
  tick();
  setInterval(tick, POLL_MS);
}
start();
</script>
</body>
</html>
